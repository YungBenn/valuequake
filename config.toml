# Ticker universe. SPY is the benchmark for beta and abnormal returns.
[tickers]
targets = ["SPY", "QQQ", "SMH", "XLE", "XLF", "TLT", "GLD", "IWM"]
sensitivity = ["UUP", "USO"]

# Outcome (impact label) definition, docs/etf-impact-scoring.md Part A.
[outcome]
label_version = "v2"             # bump whenever anything below or the engine's definition changes
beta_window = [250, 11]          # trading days [t-250, t-11] before the event session
beta_shrink = 0.7                # beta_used = 0.7 * beta_ols + 0.3 * 1.0 for equity ETFs
unshrunk_beta = ["TLT", "GLD"]
ewma_lambda = 0.94
sigma_floor_ratio = 0.5          # sigma >= 0.5 * long-run residual std
label_thresholds = [1.0, 2.0]    # |SAR|: low < 1 <= medium < 2 <= high

# Scheduled Releases: FRED release ids (all published at 08:30 ET) plus FOMC decisions (14:00 ET).
[scheduled_releases]
fred = { CPI = 10, NFP = 50, GDP = 53, PCE = 54 }
fred_time_et = "08:30"
fomc_time_et = "14:00"
# Final day of each FOMC meeting, from federalreserve.gov/monetarypolicy/fomccalendars.htm.
# The 2025-08-22 notation vote is left out: it was not a rate decision.
fomc = [
    "2021-01-27", "2021-03-17", "2021-04-28", "2021-06-16", "2021-07-28", "2021-09-22", "2021-11-03", "2021-12-15",
    "2022-01-26", "2022-03-16", "2022-05-04", "2022-06-15", "2022-07-27", "2022-09-21", "2022-11-02", "2022-12-14",
    "2023-02-01", "2023-03-22", "2023-05-03", "2023-06-14", "2023-07-26", "2023-09-20", "2023-11-01", "2023-12-13",
    "2024-01-31", "2024-03-20", "2024-05-01", "2024-06-12", "2024-07-31", "2024-09-18", "2024-11-07", "2024-12-18",
    "2025-01-29", "2025-03-19", "2025-05-07", "2025-06-18", "2025-07-30", "2025-09-17", "2025-10-29", "2025-12-10",
    "2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09",
]

[macro]
series = ["VIXCLS", "DGS10"]

# Base Rates from placebo publish times (ADR 0002), refreshed monthly by the daily job.
[base_rates]
placebo_n = 5000                 # draws per ETF
history_years = 5
seed = 20261029                  # with the ETF name, reproduces every draw
